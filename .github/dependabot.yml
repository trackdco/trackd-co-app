# Dependabot — staged by the security audit (2026-09-08), NOT yet enabled.
# Committing this file does not switch anything on; Dependabot activates only once
# the repo has Dependabot alerts enabled in Settings -> Code security. Review, then
# enable there. Grouped so it opens few PRs, and security updates are separated so
# a CVE fix is never buried in a routine bump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
